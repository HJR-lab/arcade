<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cx, cy, dpr;

// ---- Game Variables (declared early to avoid temporal dead zone) ----
let score, lives, level, combo, comboTimer, comboMax;
let player, bullets, asteroids, particles, shockwaves;
let shakeX = 0, shakeY = 0, shakeDur = 0, shakeMag = 0;
let shootCooldown = 0, spawnTimer = 0, spawnInterval = 3.0;
let waveCount = 0, waveComplete = false, waveTimer = 0, waveJustStarted = false;
let pendingSpawnCount = 0; // asteroids still queued in setTimeouts for the current wave
let orbitRadius = 200, orbitAngle = -Math.PI / 2, orbitSpeed = 2.2;
let bgStars;
let wellPulse = 0;
let flashColor = '#fff', flashAlpha = 0;
let highScore = parseInt(localStorage.getItem('gwHighScore') || '0', 10);
let gameId = 0; // incremented on each startGame to invalidate stale timeouts

// ---- Ship sprite (matches reference artwork) ----
const shipImg = new Image();
let shipImgLoaded = false;
shipImg.onload = () => { shipImgLoaded = true; };
shipImg.onerror = () => { console.warn('Failed to load spaceship.png'); };
shipImg.src = 'spaceship.png';

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  orbitRadius = Math.min(W, H) * 0.28;
}
resize();
window.addEventListener('resize', resize);

// ---- State Machine ----
const STATE = { MENU: 'MENU', PLAYING: 'PLAYING', PAUSED: 'PAUSED', GAMEOVER: 'GAMEOVER' };
let state = STATE.MENU;

function setState(s) { state = s; }

// ---- Audio ----
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, type, duration, volume, freqEnd) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function sfxShoot()   { playTone(400, 'square', 0.1, 0.15, 200); }
function sfxHit()     { playTone(200, 'sawtooth', 0.2, 0.25, 60); }
function sfxExplode() { playTone(80, 'sawtooth', 0.4, 0.3, 30); }
function sfxLevelUp() { playTone(440, 'sine', 0.1, 0.3); setTimeout(() => playTone(550, 'sine', 0.1, 0.3), 100); setTimeout(() => playTone(660, 'sine', 0.2, 0.3), 200); }
function sfxDie()     { playTone(300, 'sawtooth', 0.6, 0.4, 40); }
function sfxOrbit()   { /* subtle hum handled elsewhere */ }

// ---- Input ----
const keys = {};
let mouseAngle = 0;
let mouseDown = false;
let lastMouseX = 0, lastMouseY = 0;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') {
    if (state === STATE.PLAYING) setState(STATE.PAUSED);
    else if (state === STATE.PAUSED) setState(STATE.PLAYING);
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    initAudio();
    if (state === STATE.MENU) startGame();
    else if (state === STATE.GAMEOVER) startGame();
    else if (state === STATE.PAUSED) setState(STATE.PLAYING);
  }
  if (e.code === 'KeyR' && state === STATE.GAMEOVER) { initAudio(); startGame(); }
  if (e.code === 'KeyP' && state === STATE.PLAYING) setState(STATE.PAUSED);
  if (e.code === 'KeyP' && state === STATE.PAUSED) setState(STATE.PLAYING);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  lastMouseX = e.clientX - r.left;
  lastMouseY = e.clientY - r.top;
  mouseAngle = Math.atan2(lastMouseY - cy, lastMouseX - cx);
});

canvas.addEventListener('mousedown', e => {
  initAudio();
  mouseDown = true;
  if (state === STATE.MENU) startGame();
  else if (state === STATE.GAMEOVER) startGame();
  else if (state === STATE.PAUSED) setState(STATE.PLAYING);
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });

canvas.addEventListener('touchstart', e => {
  initAudio();
  e.preventDefault();
  mouseDown = true;
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  lastMouseX = t.clientX - r.left;
  lastMouseY = t.clientY - r.top;
  mouseAngle = Math.atan2(lastMouseY - cy, lastMouseX - cx);
  if (state === STATE.MENU) startGame();
  else if (state === STATE.GAMEOVER) startGame();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  lastMouseX = t.clientX - r.left;
  lastMouseY = t.clientY - r.top;
  mouseAngle = Math.atan2(lastMouseY - cy, lastMouseX - cx);
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); mouseDown = false; }, { passive: false });

function startGame() {
  gameId++; // invalidate all stale timeouts from the previous game
  setState(STATE.PLAYING);
  score = 0;
  lives = 3;
  level = 1;
  combo = 0;
  comboTimer = 0;
  comboMax = 1;
  bullets = [];
  asteroids = [];
  particles = [];
  shockwaves = [];
  shakeX = 0; shakeY = 0; shakeDur = 0; shakeMag = 0;
  shootCooldown = 0;
  spawnTimer = 0;
  spawnInterval = 3.0;
  waveCount = 0;
  waveComplete = false;
  waveTimer = 0;
  waveJustStarted = false;
  pendingSpawnCount = 0;
  wellPulse = 0;
  flashColor = '#fff';
  flashAlpha = 0;

  orbitRadius = Math.min(W, H) * 0.28;
  orbitAngle = -Math.PI / 2;
  orbitSpeed = 2.2;

  player = {
    x: cx, y: cy - orbitRadius,
    angle: 0,
    alive: true,
    invincible: 2.5,  // grace period at game start while first wave spawns in
    trail: [],
  };

  if (!bgStars) generateStars();
  spawnWave();
}

function generateStars() {
  bgStars = [];
  for (let i = 0; i < 220; i++) {
    bgStars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.5 + 0.3,
      bright: Math.random(),
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.5 + 0.1,
    });
  }
}

function spawnWave() {
  waveComplete = false;
  waveTimer = 0;
  waveJustStarted = true; // block wave-complete re-detection until first asteroid arrives
  // Softer wave scaling: fewer asteroids per wave, stagger spawns more
  const count = 2 + Math.floor(level * 1.2) + Math.floor(Math.random() * 2);
  pendingSpawnCount = count; // track queued spawns so fast kills don't falsely complete the wave
  const myGameId = gameId;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (gameId !== myGameId) return;
      pendingSpawnCount = Math.max(0, pendingSpawnCount - 1);
      spawnAsteroid();
    }, i * 600);
  }
  waveCount = count;
}

function spawnAsteroid(big) {
  if (state !== STATE.PLAYING) return;
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H) * 0.65;
  const x = cx + Math.cos(angle) * dist;
  const y = cy + Math.sin(angle) * dist;

  const size = big ? 42 : (Math.random() < 0.3 ? 36 : (Math.random() < 0.5 ? 24 : 16));
  // Slower base speed, gentler level ramp, hard cap so gravity doesn't compound into instant death
  const rawSpeed = (30 + Math.random() * 20) * (1 + level * 0.04) / (size / 20);
  const speed = Math.min(rawSpeed, 90);

  // Aim slightly toward center (black hole pulls)
  const toCenter = Math.atan2(cy - y, cx - x);
  const spread = 0.5;
  const aimAngle = toCenter + (Math.random() - 0.5) * spread;

  const verts = Math.floor(7 + Math.random() * 5);
  const shape = [];
  for (let i = 0; i < verts; i++) {
    const a = (i / verts) * Math.PI * 2;
    const r = size * (0.7 + Math.random() * 0.55);
    shape.push({ a, r });
  }

  asteroids.push({
    x, y,
    vx: Math.cos(aimAngle) * speed,
    vy: Math.sin(aimAngle) * speed,
    size,
    shape,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 1.5,
    hp: size > 30 ? 2 : 1,
    maxHp: size > 30 ? 2 : 1,
    color: randomAsteroidColor(),
    absorbed: false,
  });
}

function randomAsteroidColor() {
  const colors = ['#a0856c', '#8a7060', '#c0a080', '#907050', '#b09070', '#d0b090'];
  return colors[Math.floor(Math.random() * colors.length)];
}

// ---- Particles ----
function spawnParticles(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.8);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: life * (0.5 + Math.random() * 0.7),
      maxLife: life,
      size: size * (0.5 + Math.random() * 0.8),
      color,
    });
  }
}

function spawnShockwave(x, y, color) {
  shockwaves.push({ x, y, r: 5, maxR: 80, life: 1, color });
}

// ---- Screen Shake ----
function shake(mag, dur) {
  if (mag > shakeMag) { shakeMag = mag; shakeDur = dur; }
}

function screenFlash(color, alpha) {
  flashColor = color;
  flashAlpha = alpha;
}

// ---- Update ----
let lastTime = 0;

function update(now) {
  const rawDt = (now - lastTime) / 1000;
  lastTime = now;
  const dt = Math.min(rawDt, 0.05);

  wellPulse = (wellPulse + dt * 1.8) % (Math.PI * 2);

  if (state !== STATE.PLAYING) return;

  // Screen shake
  if (shakeDur > 0) {
    shakeDur -= dt;
    shakeX = (Math.random() - 0.5) * shakeMag * 2;
    shakeY = (Math.random() - 0.5) * shakeMag * 2;
  } else {
    shakeX = 0; shakeY = 0;
    shakeMag = 0;
  }

  // Flash decay
  flashAlpha = Math.max(0, flashAlpha - dt * 4);

  // Combo timer
  if (combo > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      combo = 0;
      comboMax = 1;
    }
  }

  // Player orbit
  if (player.alive) {
    let targetOrbitSpeed = orbitSpeed;

    // Keyboard orbit controls — if keys held, skip mouse lerp so they don't fight
    const usingKeyboard = keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD'];
    if (keys['ArrowLeft'] || keys['KeyA']) orbitAngle -= orbitSpeed * dt * 1.0;
    if (keys['ArrowRight'] || keys['KeyD']) orbitAngle += orbitSpeed * dt * 1.0;

    // Mouse: aim toward mouse position — skipped when keyboard is actively held
    if (!usingKeyboard && (lastMouseX !== 0 || lastMouseY !== 0)) {
      const targetAngle = Math.atan2(lastMouseY - cy, lastMouseX - cx);
      // Smooth orbit angle toward mouse
      let diff = targetAngle - orbitAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      orbitAngle += diff * dt * 3.5;
    }

    player.x = cx + Math.cos(orbitAngle) * orbitRadius;
    player.y = cy + Math.sin(orbitAngle) * orbitRadius;
    // Ship faces outward tangent (perpendicular to orbit)
    player.angle = orbitAngle + Math.PI / 2;

    // Trail
    player.trail.push({ x: player.x, y: player.y, life: 1 });
    if (player.trail.length > 18) player.trail.shift();
    for (const t of player.trail) t.life -= dt * 5;

    // Invincibility frames
    if (player.invincible > 0) player.invincible -= dt;

    // Auto-fire toward closest asteroid
    shootCooldown -= dt;
    const autoFireInterval = Math.max(0.10, 0.18 - level * 0.008);
    if (shootCooldown <= 0 && asteroids.length > 0) {
      // Find closest asteroid
      let closest = null, closestDist = Infinity;
      for (const a of asteroids) {
        const d = Math.hypot(a.x - player.x, a.y - player.y);
        if (d < closestDist) { closestDist = d; closest = a; }
      }
      if (closest) {
        const spd = 620 + level * 20;
        // Lead the target: predict where the asteroid will be when bullet arrives
        const toDx = closest.x - player.x;
        const toDy = closest.y - player.y;
        const dist0 = Math.hypot(toDx, toDy);
        const travelTime = dist0 / spd;
        const aimX = closest.x + closest.vx * travelTime;
        const aimY = closest.y + closest.vy * travelTime;
        const shootAngle = Math.atan2(aimY - player.y, aimX - player.x);
        bullets.push({
          x: player.x + Math.cos(shootAngle) * 18,
          y: player.y + Math.sin(shootAngle) * 18,
          vx: Math.cos(shootAngle) * spd,
          vy: Math.sin(shootAngle) * spd,
          life: 1.2,
        });
        sfxShoot();
        shootCooldown = autoFireInterval;
      }
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    // Gravity pull toward center (dramatic effect)
    const dx = cx - b.x, dy = cy - b.y;
    const d = Math.hypot(dx, dy);
    if (d > 0) {
      const grav = 800 / (d * d + 1) * d;
      b.vx += (dx / d) * grav * dt;
      b.vy += (dy / d) * grav * dt;
    }
    if (b.life <= 0 || d < 28) {
      bullets.splice(i, 1);
    }
  }

  // Asteroids
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    // Gravitational pull toward black hole
    const dx = cx - a.x, dy = cy - a.y;
    const dist = Math.hypot(dx, dy);
    // Weaker gravity so asteroids don't rocket-accelerate into the player
    const gravStrength = 80 + level * 5;
    if (dist > 0) {
      a.vx += (dx / dist) * gravStrength * dt;
      a.vy += (dy / dist) * gravStrength * dt;
    }
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rot += a.rotSpeed * dt;

    // Absorbed by black hole
    if (dist < 30 && !a.absorbed) {
      a.absorbed = true;
      sfxExplode();
      shake(8, 0.25);
      screenFlash('#f44', 0.3);
      spawnParticles(a.x, a.y, 12, '#ff6600', 120, 0.6, 6);
      if (player.alive && player.invincible <= 0) {
        lives--;
        player.invincible = 2.0;
        sfxDie();
        shake(16, 0.5);
        screenFlash('#f00', 0.6);
        spawnParticles(cx, cy, 20, '#ff2200', 150, 0.8, 8);
        if (lives <= 0) {
          player.alive = false;
          const myGameId = gameId;
          setTimeout(() => {
            if (gameId !== myGameId) return;
            if (score > highScore) { highScore = score; localStorage.setItem('gwHighScore', highScore); }
            setState(STATE.GAMEOVER);
          }, 1500);
        }
      }
      asteroids.splice(i, 1);
      continue;
    }

    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.size) {
        bullets.splice(j, 1);
        a.hp--;
        sfxHit();
        spawnParticles(b.x, b.y, 8, '#ffcc44', 100, 0.4, 4);

        if (a.hp <= 0) {
          // Destroyed
          combo++;
          comboTimer = 2.5;
          if (combo > comboMax) comboMax = combo;
          const pts = Math.round(a.size * 2 * (1 + (combo - 1) * 0.5)) * level;
          score += pts;

          sfxExplode();
          shake(5 + a.size * 0.15, 0.18);
          spawnParticles(a.x, a.y, 16 + a.size / 2, a.color, 130 + a.size * 2, 0.7, a.size * 0.25);
          spawnParticles(a.x, a.y, 8, '#fff', 200, 0.3, 3);
          spawnShockwave(a.x, a.y, a.color);

          // Split large asteroids
          if (a.size > 28) {
            for (let k = 0; k < 2; k++) {
              const angle = Math.random() * Math.PI * 2;
              const spd = 60 + Math.random() * 60;
              const verts = Math.floor(6 + Math.random() * 4);
              const newSize = a.size * 0.55;
              const shape = [];
              for (let v = 0; v < verts; v++) {
                const va = (v / verts) * Math.PI * 2;
                shape.push({ a: va, r: newSize * (0.7 + Math.random() * 0.55) });
              }
              asteroids.push({
                x: a.x + Math.cos(angle) * 20,
                y: a.y + Math.sin(angle) * 20,
                vx: a.vx * 0.5 + Math.cos(angle) * spd,
                vy: a.vy * 0.5 + Math.sin(angle) * spd,
                size: newSize,
                shape,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 2.5,
                hp: 1, maxHp: 1,
                color: a.color,
                absorbed: false,
              });
            }
          }
          asteroids.splice(i, 1);
        }
        break;
      }
    }
  }

  // Player-asteroid collision
  if (player.alive && player.invincible <= 0) {
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      // Tighter hitbox — use half size so only direct center hits count
      if (Math.hypot(player.x - a.x, player.y - a.y) < a.size * 0.55 + 6) {
        lives--;
        player.invincible = 2.0;
        sfxDie();
        shake(18, 0.55);
        screenFlash('#f00', 0.7);
        spawnParticles(player.x, player.y, 25, '#4af', 160, 0.9, 7);
        asteroids.splice(i, 1);
        if (lives <= 0) {
          player.alive = false;
          const myGameId = gameId;
          setTimeout(() => {
            if (gameId !== myGameId) return;
            if (score > highScore) { highScore = score; localStorage.setItem('gwHighScore', highScore); }
            setState(STATE.GAMEOVER);
          }, 1500);
        }
        break;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - dt * 2.5);
    p.vy *= (1 - dt * 2.5);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 180 * dt;
    sw.life -= dt * 2.5;
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }

  // Wave management — waveComplete is only set when ALL wave asteroids are gone
  // and the new wave isn't still in the process of spawning (waveJustStarted).
  // waveJustStarted stays true until at least one asteroid exists, ensuring
  // the brief async gap between spawnWave() and first setTimeout asteroid
  // doesn't falsely re-trigger a wave-complete.
  if (waveJustStarted && asteroids.length > 0) {
    waveJustStarted = false; // wave has population — safe to watch for completion
  }
  // Only mark wave complete when ALL queued spawns have fired AND no asteroids remain
  if (asteroids.length === 0 && !waveComplete && !waveJustStarted && pendingSpawnCount === 0) {
    waveComplete = true;
    waveTimer = 2.5;
  }

  if (waveComplete) {
    waveTimer -= dt;
    if (waveTimer <= 0) {
      level++;
      sfxLevelUp();
      spawnWave(); // sets waveJustStarted = true internally
      spawnTimer = spawnInterval * (0.8 + Math.random() * 0.5); // don't instantly fire stray
      // Grace period so a new wave doesn't immediately punish the player
      if (player && player.alive) player.invincible = Math.max(player.invincible, 1.5);
    }
  }

  // Continuous stray asteroid spawning for tension — slower cap and longer interval
  spawnTimer -= dt;
  if (spawnTimer <= 0 && asteroids.length < 5 + level) {
    spawnTimer = spawnInterval * (0.8 + Math.random() * 0.5);
    spawnInterval = Math.max(1.8, 4.0 - level * 0.12);
    spawnAsteroid();
  }
}

// ---- Render ----
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `${r},${g},${b}`;
}

function drawStars(dt) {
  for (const s of bgStars) {
    s.twinkle += dt * s.speed;
    const bright = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
    const sx = ((s.x + Date.now() * 0.002) % (W + 100)) - 50;
    const sy = s.y % H;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${bright * 0.8})`;
    ctx.fill();
  }
}

function drawBlackHole() {
  const pulse = Math.sin(wellPulse) * 0.15;
  const r = 28 + pulse * 5;

  // Event horizon glow rings
  for (let i = 4; i >= 1; i--) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * (1 + i * 0.6));
    g.addColorStop(0, `rgba(0,0,0,1)`);
    g.addColorStop(0.4, `rgba(20,0,40,0.6)`);
    g.addColorStop(1, `rgba(0,0,0,0)`);
    ctx.beginPath();
    ctx.arc(cx, cy, r * (1 + i * 0.6), 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // Accretion disk
  ctx.save();
  ctx.translate(cx, cy);
  const diskCount = 3;
  for (let i = 0; i < diskCount; i++) {
    const diskAngle = wellPulse * (0.6 + i * 0.2) + i * Math.PI * 0.4;
    const diskR = r * (1.6 + i * 0.5);
    const spread = 8 + i * 4;
    for (let j = 0; j < 8; j++) {
      const a = diskAngle + (j / 8) * Math.PI * 2;
      const px = Math.cos(a) * diskR;
      const py = Math.sin(a) * diskR * 0.35;
      const colors = ['#ff6600', '#ff3300', '#ffaa00', '#cc00ff', '#6600cc'];
      ctx.beginPath();
      ctx.arc(px, py, spread * (0.3 + Math.random() * 0.3), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${colors[i % colors.length].slice(1).match(/../g).map(x => parseInt(x, 16)).join(',')},${0.25 + Math.random() * 0.2})`;
      ctx.fill();
    }
  }
  ctx.restore();

  // Core black circle
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  coreGrad.addColorStop(0, '#000');
  coreGrad.addColorStop(0.8, '#050010');
  coreGrad.addColorStop(1, '#1a0030');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = coreGrad;
  ctx.fill();

  // Orbit path indicator
  ctx.beginPath();
  ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(100,200,255,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 12]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer() {
  if (!player) return;

  // Trail (cosmic violet wash)
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    if (t.life <= 0) continue;
    const alpha = t.life * 0.45;
    const size = 3.5 * t.life;
    ctx.beginPath();
    ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150,130,255,${alpha})`;
    ctx.fill();
  }

  if (!player.alive) return;

  // Blink when invincible — skip on pause so the ship isn't frozen invisible on the pause screen
  if (state !== STATE.PAUSED && player.invincible > 0 && Math.floor(player.invincible * 8) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // Soft cosmic halo behind the sprite (additive)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(0, 0, 4, 0, 0, 38);
  halo.addColorStop(0, 'rgba(120,180,255,0.45)');
  halo.addColorStop(0.55, 'rgba(140,80,220,0.20)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(0, 0, 38, 0, Math.PI * 2);
  ctx.fillStyle = halo;
  ctx.fill();
  ctx.restore();

  if (shipImgLoaded) {
    // Use the reference artwork as a sprite.
    // Image native size is 1076x1462. We additively blend so the dark space
    // background of the source PNG vanishes into the game's black space.
    const aspect = shipImg.naturalWidth / shipImg.naturalHeight; // ~0.736
    const drawH = 64;
    const drawW = drawH * aspect;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(shipImg, -drawW / 2, -drawH * 0.6, drawW, drawH);
    ctx.restore();
  } else {
    // Fallback while the image is loading: simple bright arrowhead.
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(10, 10);
    ctx.lineTo(-10, 10);
    ctx.closePath();
    ctx.fillStyle = '#7be8ff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();
}

function drawAsteroids() {
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    // Glow for damaged asteroids
    if (a.hp < a.maxHp) {
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, a.size * 1.5);
      glow.addColorStop(0, 'rgba(255,100,0,0.4)');
      glow.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.beginPath();
      ctx.arc(0, 0, a.size * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(Math.cos(a.shape[0].a) * a.shape[0].r, Math.sin(a.shape[0].a) * a.shape[0].r);
    for (let i = 1; i < a.shape.length; i++) {
      ctx.lineTo(Math.cos(a.shape[i].a) * a.shape[i].r, Math.sin(a.shape[i].a) * a.shape[i].r);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(0, -a.size * 0.3, 0, 0, 0, a.size);
    grad.addColorStop(0, lighten(a.color, 40));
    grad.addColorStop(1, darken(a.color, 30));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

function lighten(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) {
  const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amt);
  return `rgb(${r},${g},${b})`;
}

function drawBullets() {
  for (const b of bullets) {
    const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 8);
    glow.addColorStop(0, 'rgba(255,230,80,1)');
    glow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffa0';
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawShockwaves() {
  for (const sw of shockwaves) {
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${sw.color.slice(1).match(/../g).map(x => parseInt(x, 16)).join(',')},${sw.life * 0.6})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
}

function drawHUD() {
  ctx.save();

  // Score
  ctx.font = 'bold 28px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(score.toString().padStart(8, '0'), 24, 44);

  // Level
  ctx.font = '16px "Courier New"';
  ctx.fillStyle = '#8af';
  ctx.fillText(`WAVE ${level}`, 24, 66);

  // Lives — small versions of the ship sprite
  ctx.textAlign = 'right';
  for (let i = 0; i < 3; i++) {
    const x = W - 24 - i * 30;
    const y = 40;
    ctx.save();
    ctx.translate(x, y);
    if (shipImgLoaded) {
      const aspect = shipImg.naturalWidth / shipImg.naturalHeight;
      const h = 28;
      const w = h * aspect;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // Active lives: full brightness; dead lives: dim via alpha so the dark PNG
      // background still vanishes (source-over at low alpha would show the black rect)
      ctx.globalAlpha = i < lives ? 1.0 : 0.25;
      ctx.drawImage(shipImg, -w / 2, -h * 0.55, w, h);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(7, 7);
      ctx.lineTo(-7, 7);
      ctx.closePath();
      ctx.fillStyle = i < lives ? '#4af' : 'rgba(100,150,200,0.2)';
      ctx.fill();
    }
    ctx.restore();
  }

  // Combo
  if (combo >= 2) {
    const t = comboTimer / 2.5;
    ctx.globalAlpha = Math.min(1, t * 3);
    const comboFontSize = Math.min(72, 24 + combo * 3); // cap so text never overflows screen
    ctx.font = `bold ${comboFontSize}px "Courier New"`;
    ctx.textAlign = 'center';
    const colors = ['#fff', '#ff0', '#f80', '#f40', '#f0f'];
    ctx.fillStyle = colors[Math.min(combo - 1, colors.length - 1)];
    ctx.fillText(`x${combo} COMBO!`, W / 2, H - 60);
    ctx.globalAlpha = 1;
  }

  // Wave clear message
  if (waveComplete && waveTimer > 0) {
    const t = waveTimer / 2.5;
    const pulse2 = 1 + Math.sin(Date.now() * 0.008) * 0.05;
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.font = `bold ${Math.round(36 * pulse2)}px "Courier New"`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4f8';
    ctx.fillText('WAVE CLEAR!', W / 2, H / 2 + 120);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawMenu() {
  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,5,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.save();
  ctx.textAlign = 'center';

  // Title glow
  ctx.font = 'bold 72px "Courier New"';
  ctx.shadowColor = '#8844ff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#cc88ff';
  ctx.fillText('GRAVITY', W / 2, H / 2 - 80);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('WELL', W / 2, H / 2 - 10);
  ctx.shadowBlur = 0;

  ctx.font = '18px "Courier New"';
  ctx.fillStyle = '#8af';
  ctx.fillText('Orbit the black hole. Survive the asteroid field.', W / 2, H / 2 + 50);

  ctx.font = '14px "Courier New"';
  ctx.fillStyle = 'rgba(200,200,200,0.7)';
  ctx.fillText('Move mouse to orbit  •  Auto-fire enabled  •  A/D or Arrow keys', W / 2, H / 2 + 82);

  const pulse2 = 0.7 + Math.sin(Date.now() * 0.004) * 0.3;
  ctx.globalAlpha = pulse2;
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.fillText('CLICK OR PRESS SPACE TO PLAY', W / 2, H / 2 + 140);
  ctx.globalAlpha = 1;

  if (highScore > 0) {
    ctx.font = '16px "Courier New"';
    ctx.fillStyle = '#ff0';
    ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H / 2 + 180);
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,5,0.8)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';

  ctx.font = 'bold 60px "Courier New"';
  ctx.shadowColor = '#ff2200';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#ff4422';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 36px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.fillText(`SCORE: ${score}`, W / 2, H / 2 - 20);

  ctx.font = '20px "Courier New"';
  ctx.fillStyle = '#8af';
  ctx.fillText(`WAVE REACHED: ${level}`, W / 2, H / 2 + 25);
  ctx.fillText(`BEST COMBO: x${comboMax}`, W / 2, H / 2 + 55);

  if (score > 0 && score === highScore) {
    // highScore was already updated in the GAMEOVER timeout before setState(GAMEOVER),
    // so equality means this run set the new record.
    ctx.font = 'bold 22px "Courier New"';
    ctx.fillStyle = '#ff0';
    ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 95);
  } else {
    ctx.font = '18px "Courier New"';
    ctx.fillStyle = '#888';
    ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H / 2 + 95);
  }

  const pulse2 = 0.7 + Math.sin(Date.now() * 0.005) * 0.3;
  ctx.globalAlpha = pulse2;
  ctx.font = 'bold 22px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.fillText('PRESS R OR CLICK TO RESTART', W / 2, H / 2 + 155);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 48px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.fillText('PAUSED', W / 2, H / 2);
  ctx.font = '20px "Courier New"';
  ctx.fillStyle = '#aaa';
  ctx.fillText('ESC or P to resume', W / 2, H / 2 + 50);
  ctx.restore();
}

let lastRenderTime = 0;
function render(now) {
  const dt = Math.min((now - lastRenderTime) / 1000, 0.05);
  lastRenderTime = now;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background
  ctx.fillStyle = '#000008';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  if (bgStars) drawStars(dt);

  if (state !== STATE.MENU) {
    drawBlackHole();
    drawShockwaves();
    drawParticles();
    drawAsteroids();
    drawBullets();
    drawPlayer();
  } else {
    drawBlackHole();
  }

  ctx.restore();

  // Screen flash (no shake offset)
  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (state === STATE.PLAYING || state === STATE.PAUSED) drawHUD();
  if (state === STATE.MENU) drawMenu();
  if (state === STATE.GAMEOVER) drawGameOver();
  if (state === STATE.PAUSED) drawPause();
}

// ---- Main Loop ----
function loop(now) {
  update(now);
  render(now);
  requestAnimationFrame(loop);
}

generateStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
