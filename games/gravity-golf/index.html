<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Golf</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; cursor: crosshair; }
  #ui-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #hud {
    position: fixed; top: 16px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 20px;
    color: #fff;
    font-size: 16px;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
    pointer-events: none;
  }
  #hud-left, #hud-right { display: flex; flex-direction: column; gap: 4px; }
  #mute-btn {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    pointer-events: all;
    z-index: 30;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, opacity 0.2s;
    opacity: 0.6;
    line-height: 1;
  }
  #mute-btn:hover { border-color: rgba(255,255,255,0.7); opacity: 1; }
  #screen-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    color: #fff;
    pointer-events: all;
    transition: opacity 0.3s;
  }
  #screen-overlay h1 { font-size: 48px; margin-bottom: 12px; text-shadow: 0 0 20px #4af; letter-spacing: 4px; }
  #screen-overlay h2 { font-size: 32px; margin-bottom: 12px; text-shadow: 0 0 16px #4f4; }
  #screen-overlay p { font-size: 16px; color: #aaa; margin-bottom: 8px; line-height: 1.6; }
  #screen-overlay button {
    margin-top: 20px;
    padding: 12px 32px;
    background: transparent;
    border: 2px solid #4af;
    color: #4af;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  #screen-overlay button:hover { background: rgba(68,170,255,0.15); box-shadow: 0 0 16px #4af; }
  #screen-overlay.hidden { display: none; }
  #next-btn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 12px 32px;
    background: transparent;
    border: 2px solid #4f4;
    color: #4f4;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    display: none;
    z-index: 20;
  }
  #next-btn:hover { background: rgba(68,255,68,0.15); box-shadow: 0 0 16px #4f4; }
  #level-complete-msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #4f4; font-size: 28px; letter-spacing: 4px;
    text-shadow: 0 0 20px #4f4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 20;
  }
  #level-complete-msg.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hud-left">
    <span id="hud-level">LEVEL 1</span>
    <span id="hud-strokes">STROKES: 0</span>
  </div>
  <div id="hud-right">
    <span id="hud-par"></span>
    <span id="hud-status"></span>
  </div>
</div>
<button id="mute-btn" title="Toggle sound">&#128266;</button>
<div id="screen-overlay">
  <h1>GRAVITY GOLF</h1>
  <p>Click and drag from the ball to aim.</p>
  <p>Longer drag = more power.</p>
  <p>Use planets' gravity to curve your shot.</p>
  <p style="color:#f84">Red planets are hazards — avoid them!</p>
  <button id="start-btn">LAUNCH</button>
</div>
<div id="level-complete-msg">HOLE IN ONE!</div>
<button id="next-btn">NEXT LEVEL &rarr;</button>

<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;

function resizeCanvas() {
  canvas.width  = window.innerWidth  * DPR;
  canvas.height = window.innerHeight * DPR;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeCanvas();

let lastW = window.innerWidth, lastH = window.innerHeight;
function rescaleEntities() {
  const sx = window.innerWidth / lastW;
  const sy = window.innerHeight / lastH;
  ball.x *= sx; ball.y *= sy;
  hole.x *= sx; hole.y *= sy;
  for (const p of planets) { p.x *= sx; p.y *= sy; }
  for (const t of ball.trail) { t.x *= sx; t.y *= sy; }
  lastW = window.innerWidth;
  lastH = window.innerHeight;
}
window.addEventListener('resize', () => {
  resizeCanvas();
  buildStars();
  if (state === 'MENU') {
    lastW = window.innerWidth;
    lastH = window.innerHeight;
  } else {
    rescaleEntities();
  }
});

const W = () => window.innerWidth;
const H = () => window.innerHeight;

// ─── Constants ────────────────────────────────────────────────────────────────
const G           = 2000;   // gravitational constant (tuned for feel)
const SUBSTEPS     = 8;     // physics substeps per frame
const MAX_VEL      = 800;   // cap velocity to avoid tunneling
const DRAG_PER_SEC = 0.787; // velocity factor remaining per second (FPS-independent drag)
const BALL_RADIUS  = 6;
const HOLE_RADIUS  = 12;
const PREVIEW_SECS = 1.2;   // seconds of trajectory preview
const MAX_OFFSCREEN= 300;   // pixels off canvas before ball is recalled
const POWER_SCALE  = 3.5;   // drag px → initial speed multiplier

// ─── Audio ────────────────────────────────────────────────────────────────────
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem('gg-muted') === 'true'; } catch (_) {}
function persistMuted() {
  try { localStorage.setItem('gg-muted', muted); } catch (_) {}
}

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function updateMuteBtn() {
  document.getElementById('mute-btn').innerHTML = muted ? '&#128263;' : '&#128266;';
}
updateMuteBtn();

document.getElementById('mute-btn').addEventListener('click', () => {
  muted = !muted;
  persistMuted();
  updateMuteBtn();
});

// Short noise burst with downward pitch sweep — power 0..1 scales pitch/brightness
function playLaunch(power) {
  if (muted) return;
  const ac = getAudioCtx();
  const t  = ac.currentTime;

  // White noise buffer
  const bufLen = Math.ceil(ac.sampleRate * 0.15);
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;

  // Bandpass filter — higher power = higher center freq
  const bpf = ac.createBiquadFilter();
  bpf.type            = 'bandpass';
  bpf.frequency.value = 400 + power * 2200;
  bpf.Q.value         = 2.5;

  // Pitch-like sweep via a second highpass
  const hpf = ac.createBiquadFilter();
  hpf.type            = 'highpass';
  hpf.frequency.setValueAtTime(200 + power * 800, t);
  hpf.frequency.exponentialRampToValueAtTime(80, t + 0.15);

  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.55 + power * 0.3, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

  src.connect(bpf);
  bpf.connect(hpf);
  hpf.connect(gain);
  gain.connect(ac.destination);
  src.start(t);
  src.stop(t + 0.15);
}

// Low thump + noise crunch on planet impact
function playCrash() {
  if (muted) return;
  const ac = getAudioCtx();
  const t  = ac.currentTime;

  // Sub thump via oscillator
  const osc = ac.createOscillator();
  osc.type            = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(28, t + 0.2);

  const thumpGain = ac.createGain();
  thumpGain.gain.setValueAtTime(0.9, t);
  thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

  osc.connect(thumpGain);
  thumpGain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + 0.2);

  // Noise crunch layer
  const bufLen = Math.ceil(ac.sampleRate * 0.12);
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

  const nSrc = ac.createBufferSource();
  nSrc.buffer = buf;

  const lpf = ac.createBiquadFilter();
  lpf.type            = 'lowpass';
  lpf.frequency.value = 800;

  const nGain = ac.createGain();
  nGain.gain.setValueAtTime(0.5, t);
  nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

  nSrc.connect(lpf);
  lpf.connect(nGain);
  nGain.connect(ac.destination);
  nSrc.start(t);
  nSrc.stop(t + 0.12);
}

// Rising C-E-G chime arpeggio on hole-in
function playSink() {
  if (muted) return;
  const ac   = getAudioCtx();
  const t    = ac.currentTime;
  const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
  const delays = [0, 0.12, 0.24];

  freqs.forEach((freq, i) => {
    const osc = ac.createOscillator();
    osc.type            = 'triangle';
    osc.frequency.value = freq;

    const env = ac.createGain();
    const start = t + delays[i];
    env.gain.setValueAtTime(0, start);
    env.gain.linearRampToValueAtTime(0.45, start + 0.03);
    env.gain.exponentialRampToValueAtTime(0.001, start + 0.38);

    osc.connect(env);
    env.connect(ac.destination);
    osc.start(start);
    osc.stop(start + 0.4);
  });
}

// Subtle click at drag start
function playAimTick() {
  if (muted) return;
  const ac = getAudioCtx();
  const t  = ac.currentTime;

  const bufLen = Math.ceil(ac.sampleRate * 0.018);
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);

  const src = ac.createBufferSource();
  src.buffer = buf;

  const hpf = ac.createBiquadFilter();
  hpf.type            = 'highpass';
  hpf.frequency.value = 3000;

  const gain = ac.createGain();
  gain.gain.value = 0.18;

  src.connect(hpf);
  hpf.connect(gain);
  gain.connect(ac.destination);
  src.start(t);
  src.stop(t + 0.018);
}

// ─── Game state ───────────────────────────────────────────────────────────────
let state       = 'MENU';   // MENU | PLAYING | FLYING | SUNK | GAMEOVER
let levelIndex  = 0;
let strokes     = 0;
let totalStrokes= 0;
let shakeAmt    = 0;
let autoAdvanceTimer = null;

let ball = { x:0, y:0, vx:0, vy:0, trail:[] };
let planets = [];
let hole    = { x:0, y:0, pulse:0 };

// Aim drag
let dragging = false;
let dragStart = { x:0, y:0 };
let dragCurrent = { x:0, y:0 };

// Particles
let particles = [];

// Stars
let stars = [];
function buildStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * W(),
      y: Math.random() * H(),
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.7 + 0.3,
    });
  }
}

// ─── Level definitions ────────────────────────────────────────────────────────
// Positions are expressed as fractions of screen size so levels scale with window.
// planet: { fx, fy, mass, radius, hazard }
// ball/hole: { fx, fy }
const LEVEL_DEFS = [
  // Level 1 — direct shot tutorial
  {
    par: 1,
    ball:    { fx:0.18, fy:0.5 },
    hole:    { fx:0.82, fy:0.5 },
    planets: [],
  },
  // Level 2 — one planet curves the shot
  {
    par: 2,
    ball:    { fx:0.15, fy:0.65 },
    hole:    { fx:0.82, fy:0.35 },
    planets: [
      { fx:0.50, fy:0.50, mass:18000, radius:28 },
    ],
  },
  // Level 3 — slingshot around a planet
  {
    par: 2,
    ball:    { fx:0.12, fy:0.5 },
    hole:    { fx:0.88, fy:0.5 },
    planets: [
      { fx:0.50, fy:0.50, mass:30000, radius:36 },
    ],
  },
  // Level 4 — two planets, navigate between them
  {
    par: 3,
    ball:    { fx:0.12, fy:0.5 },
    hole:    { fx:0.88, fy:0.5 },
    planets: [
      { fx:0.38, fy:0.32, mass:20000, radius:28 },
      { fx:0.62, fy:0.68, mass:20000, radius:28 },
    ],
  },
  // Level 5 — orbit a planet to reach hole on far side
  {
    par: 3,
    ball:    { fx:0.15, fy:0.5 },
    hole:    { fx:0.50, fy:0.18 },
    planets: [
      { fx:0.50, fy:0.50, mass:40000, radius:44 },
    ],
  },
  // Level 6 — multi-planet, hazard to avoid
  {
    par: 4,
    ball:    { fx:0.10, fy:0.75 },
    hole:    { fx:0.90, fy:0.25 },
    planets: [
      { fx:0.35, fy:0.50, mass:25000, radius:30 },
      { fx:0.65, fy:0.50, mass:25000, radius:30 },
      { fx:0.50, fy:0.28, mass:15000, radius:22, hazard:true },
      { fx:0.50, fy:0.72, mass:15000, radius:22, hazard:true },
    ],
  },
  // Level 7 — zigzag through multiple planets
  {
    par: 4,
    ball:    { fx:0.08, fy:0.5 },
    hole:    { fx:0.92, fy:0.5 },
    planets: [
      { fx:0.25, fy:0.30, mass:18000, radius:26 },
      { fx:0.40, fy:0.68, mass:18000, radius:26 },
      { fx:0.60, fy:0.30, mass:18000, radius:26 },
      { fx:0.75, fy:0.68, mass:18000, radius:26 },
    ],
  },
  // Level 8 — grand finale: dense planetary system
  {
    par: 5,
    ball:    { fx:0.08, fy:0.5 },
    hole:    { fx:0.92, fy:0.5 },
    planets: [
      { fx:0.30, fy:0.50, mass:35000, radius:40 },
      { fx:0.55, fy:0.28, mass:20000, radius:26 },
      { fx:0.55, fy:0.72, mass:20000, radius:26 },
      { fx:0.75, fy:0.42, mass:15000, radius:20 },
      { fx:0.75, fy:0.58, mass:15000, radius:20 },
      { fx:0.50, fy:0.50, mass:8000,  radius:14, hazard:true },
    ],
  },
];

// ─── Build a level ─────────────────────────────────────────────────────────────
function buildLevel() {
  const def = LEVEL_DEFS[levelIndex];
  ball.x   = def.ball.fx * W();
  ball.y   = def.ball.fy * H();
  ball.vx  = 0;
  ball.vy  = 0;
  ball.trail = [];
  hole.x   = def.hole.fx * W();
  hole.y   = def.hole.fy * H();
  planets  = def.planets.map(p => ({
    x:       p.fx * W(),
    y:       p.fy * H(),
    mass:    p.mass,
    radius:  p.radius,
    hazard:  !!p.hazard,
    color:   p.hazard
      ? `hsl(${0+Math.random()*20},80%,48%)`
      : `hsl(${170+Math.floor(Math.random()*180)},60%,52%)`,
    glowColor: p.hazard ? '#f44' : null,
  }));
  particles  = [];
  dragging   = false;
  state      = 'PLAYING';
  restTimer  = 0;
  lastW      = window.innerWidth;
  lastH      = window.innerHeight;
  updateHUD();
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('level-complete-msg').classList.remove('show');
}

function updateHUD() {
  const def = LEVEL_DEFS[levelIndex];
  document.getElementById('hud-level').textContent   = `LEVEL ${levelIndex+1} / ${LEVEL_DEFS.length}`;
  document.getElementById('hud-strokes').textContent = `STROKES: ${strokes}`;
  document.getElementById('hud-par').textContent     = `PAR ${def.par}`;

  const diff = strokes - def.par;
  let scoreStr = '';
  if (strokes > 0) {
    if (diff < 0)      scoreStr = diff === -1 ? 'BIRDIE' : diff === -2 ? 'EAGLE' : `${Math.abs(diff)} UNDER`;
    else if (diff === 0) scoreStr = 'PAR';
    else                scoreStr = diff === 1 ? 'BOGEY' : diff === 2 ? 'DOUBLE' : `+${diff}`;
  }
  document.getElementById('hud-status').textContent = scoreStr;
}

// ─── Gravity helpers ──────────────────────────────────────────────────────────
function gravAccel(x, y) {
  let ax = 0, ay = 0;
  for (const p of planets) {
    const dx = p.x - x;
    const dy = p.y - y;
    const r2 = dx*dx + dy*dy;
    const r  = Math.sqrt(r2);
    if (r < 1) continue;
    const a  = G * p.mass / (r2 * r); // F/m = G*m_p/r^2, normalized by r for direction
    ax += a * dx;
    ay += a * dy;
  }
  return { ax, ay };
}

// ─── Trajectory preview ───────────────────────────────────────────────────────
function computeTrajectory(x0, y0, vx0, vy0) {
  const pts   = [];
  const steps = Math.ceil(PREVIEW_SECS * 120);
  const dt    = 1/120;
  const dragFactor = Math.pow(DRAG_PER_SEC, dt);
  let x = x0, y = y0, vx = vx0, vy = vy0;
  for (let i = 0; i <= steps; i++) {
    pts.push({ x, y });
    const { ax, ay } = gravAccel(x, y);
    vx += ax * dt;
    vy += ay * dt;
    const spd = Math.sqrt(vx*vx+vy*vy);
    if (spd > MAX_VEL) { vx = vx/spd*MAX_VEL; vy = vy/spd*MAX_VEL; }
    vx *= dragFactor;
    vy *= dragFactor;
    x += vx * dt;
    y += vy * dt;
    // stop preview if it would hit a planet
    for (const p of planets) {
      if (Math.hypot(x-p.x, y-p.y) < p.radius) return pts;
    }
  }
  return pts;
}

// ─── Shooting ─────────────────────────────────────────────────────────────────
function shoot(dx, dy) {
  ball.vx = -dx * POWER_SCALE;
  ball.vy = -dy * POWER_SCALE;
  const spd = Math.hypot(ball.vx, ball.vy);
  if (spd > MAX_VEL) { ball.vx = ball.vx/spd*MAX_VEL; ball.vy = ball.vy/spd*MAX_VEL; }
  const power = Math.min(spd / MAX_VEL, 1);
  playLaunch(power);
  strokes++;
  updateHUD();
  state = 'FLYING';
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnParticles(x, y, count, color, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s     = speed * (0.5 + Math.random());
    particles.push({
      x, y,
      vx: Math.cos(angle)*s,
      vy: Math.sin(angle)*s,
      life: 1.0,
      decay: 0.025 + Math.random()*0.025,
      r:    2 + Math.random()*3,
      color,
    });
  }
}

function updateParticles(dt) {
  const drag    = Math.pow(0.96, dt * 60);
  const dtScale = dt * 60;
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dtScale;
    p.y += p.vy * dtScale;
    p.vx *= drag;
    p.vy *= drag;
    p.life -= p.decay * dtScale;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── Screen shake ─────────────────────────────────────────────────────────────
function triggerShake(amount) { shakeAmt = amount; }

// ─── Physics update ───────────────────────────────────────────────────────────
let sunkTimer = 0;
let restTimer = 0;

function updateBall(frameDt) {
  if (state !== 'FLYING') { restTimer = 0; return; }

  const dt = Math.min(frameDt, 0.05);
  const stepDt = dt / SUBSTEPS;
  const dragFactor = Math.pow(DRAG_PER_SEC, stepDt);

  for (let s = 0; s < SUBSTEPS; s++) {
    const { ax, ay } = gravAccel(ball.x, ball.y);
    ball.vx += ax * stepDt;
    ball.vy += ay * stepDt;
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > MAX_VEL) { ball.vx = ball.vx/spd*MAX_VEL; ball.vy = ball.vy/spd*MAX_VEL; }
    ball.vx *= dragFactor;
    ball.vy *= dragFactor;
    ball.x  += ball.vx * stepDt;
    ball.y  += ball.vy * stepDt;

    // planet collision
    for (const p of planets) {
      const dist = Math.hypot(ball.x - p.x, ball.y - p.y);
      if (dist < p.radius + BALL_RADIUS) {
        triggerShake(8);
        playCrash();
        spawnParticles(ball.x, ball.y, 24, p.hazard ? '#f84' : '#adf', 5);
        // reset ball to start position
        const def = LEVEL_DEFS[levelIndex];
        ball.x  = def.ball.fx * W();
        ball.y  = def.ball.fy * H();
        ball.vx = 0; ball.vy = 0;
        ball.trail = [];
        state = 'PLAYING';
        return;
      }
    }

    // hole collision
    const hDist = Math.hypot(ball.x - hole.x, ball.y - hole.y);
    if (hDist < HOLE_RADIUS + BALL_RADIUS - 2) {
      playSink();
      spawnParticles(hole.x, hole.y, 40, '#4f4', 6);
      spawnParticles(hole.x, hole.y, 20, '#fff', 3);
      state = 'SUNK';
      sunkTimer = 2.0;
      showLevelComplete();
      return;
    }

    // off-screen
    const margin = MAX_OFFSCREEN;
    if (ball.x < -margin || ball.x > W()+margin || ball.y < -margin || ball.y > H()+margin) {
      const def = LEVEL_DEFS[levelIndex];
      ball.x  = def.ball.fx * W();
      ball.y  = def.ball.fy * H();
      ball.vx = 0; ball.vy = 0;
      ball.trail = [];
      state = 'PLAYING';
      return;
    }
  }

  // ball at rest — return control to the player
  const finalSpd = Math.hypot(ball.vx, ball.vy);
  if (finalSpd < 10) {
    restTimer += frameDt;
    if (restTimer > 1.5) {
      ball.vx = 0; ball.vy = 0;
      ball.trail = [];
      state = 'PLAYING';
      restTimer = 0;
      return;
    }
  } else {
    restTimer = 0;
  }

  // trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 40) ball.trail.shift();
}

function showLevelComplete() {
  if (autoAdvanceTimer !== null) {
    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = null;
  }
  const def = LEVEL_DEFS[levelIndex];
  const diff = strokes - def.par;
  let msg = 'HOLE!';
  if (diff <= -2) msg = 'EAGLE!';
  else if (diff === -1) msg = 'BIRDIE!';
  else if (diff === 0)  msg = 'PAR!';
  else if (diff === 1)  msg = 'BOGEY';
  else msg = `+${diff}`;
  const el = document.getElementById('level-complete-msg');
  el.textContent = msg;
  el.classList.add('show');

  if (levelIndex < LEVEL_DEFS.length - 1) {
    document.getElementById('next-btn').style.display = 'block';
    autoAdvanceTimer = setTimeout(() => {
      autoAdvanceTimer = null;
      if (state === 'SUNK') {
        totalStrokes += strokes;
        strokes = 0;
        levelIndex++;
        buildLevel();
      }
    }, 1800);
  } else {
    // game complete
    setTimeout(() => showGameComplete(), 2000);
  }
  updateHUD();
}

function showGameComplete() {
  const overlay = document.getElementById('screen-overlay');
  overlay.innerHTML = `
    <h2 style="color:#4f4">COURSE COMPLETE!</h2>
    <p style="font-size:24px;margin:12px 0">Total Strokes: <b style="color:#ff8">${totalStrokes + strokes}</b></p>
    <p style="color:#aaa">Great round, astronaut.</p>
    <button onclick="restartGame()">PLAY AGAIN</button>
  `;
  overlay.classList.remove('hidden');
}

function restartGame() {
  levelIndex   = 0;
  strokes      = 0;
  totalStrokes = 0;
  document.getElementById('screen-overlay').classList.add('hidden');
  buildLevel();
}

// ─── Input ────────────────────────────────────────────────────────────────────
function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

canvas.addEventListener('mousedown', e => {
  if (state !== 'PLAYING') return;
  const pos = canvasCoords(e);
  const d   = Math.hypot(pos.x - ball.x, pos.y - ball.y);
  if (d < 30) { // must click near ball
    dragging    = true;
    dragStart   = { x: ball.x, y: ball.y };
    dragCurrent = { ...pos };
    playAimTick();
  }
});

canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  dragCurrent = canvasCoords(e);
});

canvas.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false;
  const dx = dragCurrent.x - dragStart.x;
  const dy = dragCurrent.y - dragStart.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 5) shoot(dx, dy);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== 'PLAYING') return;
  const pos = canvasCoords(e);
  const d   = Math.hypot(pos.x - ball.x, pos.y - ball.y);
  if (d < 40) {
    dragging    = true;
    dragStart   = { x: ball.x, y: ball.y };
    dragCurrent = { ...pos };
    playAimTick();
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  dragCurrent = canvasCoords(e);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dragging) return;
  dragging = false;
  const dx = dragCurrent.x - dragStart.x;
  const dy = dragCurrent.y - dragStart.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 5) shoot(dx, dy);
}, { passive: false });

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('screen-overlay').classList.add('hidden');
  buildLevel();
});

document.getElementById('next-btn').addEventListener('click', () => {
  if (autoAdvanceTimer !== null) {
    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = null;
  }
  totalStrokes += strokes;
  strokes       = 0;
  levelIndex++;
  buildLevel();
});

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    if (state === 'PLAYING' || state === 'FLYING') {
      const def = LEVEL_DEFS[levelIndex];
      ball.x  = def.ball.fx * W();
      ball.y  = def.ball.fy * H();
      ball.vx = 0; ball.vy = 0; ball.trail = [];
      state   = 'PLAYING';
    }
  }
});

// ─── Rendering ────────────────────────────────────────────────────────────────
function drawStars() {
  for (const s of stars) {
    ctx.save();
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function colorWithAlpha(color, alpha) {
  const hsl = parseHSL(color);
  if (hsl) return `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,${alpha})`;
  // hex shorthand (#rgb → #rrggbb) then append 2-digit alpha
  const hex = color.length === 4
    ? '#' + color[1]+color[1]+color[2]+color[2]+color[3]+color[3]
    : color;
  return hex + Math.round(alpha * 255).toString(16).padStart(2, '0');
}

function drawPlanet(p) {
  // glow
  const glowColor = p.hazard ? '#f44' : p.color;
  const grd = ctx.createRadialGradient(p.x, p.y, p.radius*0.4, p.x, p.y, p.radius*2.0);
  grd.addColorStop(0, colorWithAlpha(glowColor, 0.25));
  grd.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius*2.0, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // body
  const bodyGrd = ctx.createRadialGradient(p.x - p.radius*0.3, p.y - p.radius*0.3, p.radius*0.1, p.x, p.y, p.radius);
  bodyGrd.addColorStop(0, p.hazard ? '#f88' : lightenColor(p.color, 30));
  bodyGrd.addColorStop(1, p.hazard ? '#900' : darkenColor(p.color, 30));
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
  ctx.fillStyle = bodyGrd;
  ctx.fill();

  // hazard ring
  if (p.hazard) {
    ctx.save();
    ctx.strokeStyle = '#f44';
    ctx.lineWidth   = 2;
    ctx.globalAlpha = 0.6 + 0.4*Math.sin(Date.now()/300);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius+6, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawHole(now) {
  const pulse = 0.5 + 0.5*Math.sin(now/400);
  // outer pulse ring
  ctx.save();
  ctx.strokeStyle = '#4f4';
  ctx.lineWidth   = 2;
  ctx.globalAlpha = 0.4 + 0.5*pulse;
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, HOLE_RADIUS + 6 + pulse*6, 0, Math.PI*2);
  ctx.stroke();

  ctx.globalAlpha = 0.2 + 0.3*pulse;
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, HOLE_RADIUS + 14 + pulse*8, 0, Math.PI*2);
  ctx.stroke();

  // hole body
  ctx.globalAlpha = 1;
  const grd = ctx.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, HOLE_RADIUS);
  grd.addColorStop(0, '#8f8');
  grd.addColorStop(1, '#2a2');
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, HOLE_RADIUS, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // flag-like marker
  ctx.strokeStyle = '#fff';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(hole.x, hole.y - HOLE_RADIUS/2);
  ctx.lineTo(hole.x, hole.y - HOLE_RADIUS - 14);
  ctx.stroke();
  ctx.fillStyle = '#ff4';
  ctx.beginPath();
  ctx.moveTo(hole.x, hole.y - HOLE_RADIUS - 14);
  ctx.lineTo(hole.x + 10, hole.y - HOLE_RADIUS - 8);
  ctx.lineTo(hole.x, hole.y - HOLE_RADIUS - 2);
  ctx.fill();

  ctx.restore();
}

function drawTrail() {
  const len = ball.trail.length;
  if (len < 2) return;
  for (let i = 1; i < len; i++) {
    const t   = i / len;
    const a   = t * t * 0.7;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#9df';
    ctx.lineWidth   = BALL_RADIUS * 1.5 * t;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(ball.trail[i-1].x, ball.trail[i-1].y);
    ctx.lineTo(ball.trail[i].x,   ball.trail[i].y);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBall() {
  if (state === 'SUNK') return;
  // glow
  const grd = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_RADIUS*3);
  grd.addColorStop(0, 'rgba(200,230,255,0.6)');
  grd.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_RADIUS*3, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // body
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
  ctx.fillStyle = '#e8f4ff';
  ctx.fill();
  ctx.strokeStyle = '#9df';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
}

function drawAimLine() {
  if (!dragging) return;
  const dx   = dragCurrent.x - dragStart.x;
  const dy   = dragCurrent.y - dragStart.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return;

  const vx0 = -dx * POWER_SCALE;
  const vy0 = -dy * POWER_SCALE;
  const pts  = computeTrajectory(ball.x, ball.y, vx0, vy0);

  // dotted trajectory
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const t = 1 - i / pts.length;
    ctx.globalAlpha   = t * 0.8;
    ctx.strokeStyle   = '#fff';
    ctx.lineWidth     = 2;
    ctx.beginPath();
    ctx.moveTo(pts[i-1].x, pts[i-1].y);
    ctx.lineTo(pts[i].x,   pts[i].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // drag line from ball to cursor
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#7af';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(dragCurrent.x, dragCurrent.y);
  ctx.stroke();

  // power indicator circle at drag point
  const maxDrag  = MAX_VEL / POWER_SCALE;
  const powerPct = Math.min(dist / maxDrag, 1);
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = `hsl(${120 - powerPct*120}, 100%, 60%)`;
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.arc(dragCurrent.x, dragCurrent.y, 8, 0, Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── Color helpers ────────────────────────────────────────────────────────────
function parseHSL(color) {
  const m = color.match(/hsl\((\d+),(\d+)%,(\d+)%\)/);
  if (!m) return null;
  return [+m[1], +m[2], +m[3]];
}
function lightenColor(color, amt) {
  const hsl = parseHSL(color);
  if (!hsl) return color;
  return `hsl(${hsl[0]},${hsl[1]}%,${Math.min(100, hsl[2]+amt)}%)`;
}
function darkenColor(color, amt) {
  const hsl = parseHSL(color);
  if (!hsl) return color;
  return `hsl(${hsl[0]},${hsl[1]}%,${Math.max(0, hsl[2]-amt)}%)`;
}

// ─── Game loop ────────────────────────────────────────────────────────────────
let lastTime = 0;

function gameLoop(now) {
  requestAnimationFrame(gameLoop);

  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime    = now;

  // screen shake
  let sx = 0, sy = 0;
  if (shakeAmt > 0) {
    sx = (Math.random()-0.5) * shakeAmt * 2;
    sy = (Math.random()-0.5) * shakeAmt * 2;
    shakeAmt *= Math.pow(0.85, rawDt * 60);
    if (shakeAmt < 0.1) shakeAmt = 0;
  }

  ctx.save();
  ctx.translate(sx, sy);

  // background
  ctx.fillStyle = '#050810';
  ctx.fillRect(-10, -10, W()+20, H()+20);

  drawStars();

  if (state !== 'MENU') {
    for (const p of planets) drawPlanet(p);
    drawHole(now);
    drawTrail();
    drawBall();
    drawAimLine();
  }
  drawParticles();

  ctx.restore();

  updateBall(rawDt);
  updateParticles(rawDt);

  // sunk state countdown before showing next
  if (state === 'SUNK') {
    sunkTimer -= rawDt;
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildStars();
requestAnimationFrame(gameLoop);
</script>
<script src="../../arcade-home.js" data-corner="bottom-left"></script>
</body>
