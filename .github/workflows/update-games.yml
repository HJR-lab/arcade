name: Update Games List

on:
  push:
    paths:
      - 'games/*/index.html'
      - 'games/*/game.json'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate games.json from folders
        run: |
          echo "[" > games.json
          first=true
          for dir in games/*/; do
            id=$(basename "$dir")
            if [ -f "$dir/game.json" ]; then
              name=$(jq -r '.name' "$dir/game.json")
              description=$(jq -r '.description' "$dir/game.json")
            else
              name=$(grep -oP '(?<=<title>).*?(?=</title>)' "$dir/index.html" 2>/dev/null || echo "$id")
              description=""
            fi
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> games.json
            fi
            printf '  { "id": "%s", "name": "%s", "description": "%s" }' "$id" "$name" "$description" >> games.json
          done
          echo "" >> games.json
          echo "]" >> games.json

      - name: Commit updated games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Auto-update games.json"
          git push
